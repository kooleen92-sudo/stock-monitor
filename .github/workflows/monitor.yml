name: Stock Valuation Monitor

on:
  schedule:
    # 北京时间每周五上午 7:00 运行 (对应 UTC 时间每周四 23:00)
    - cron: '0 23 * * 4'
  workflow_dispatch: # 允许你在网页上手动点击按钮立即运行

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 自动缓存pip安装包，加快每次运行速度

      - name: Cache SQLite Database
        uses: actions/cache@v4
        with:
          path: data/
          # 每次运行生成一个新的缓存key，同时恢复最近一次的缓存数据
          key: stock-db-${{ github.run_id }}
          restore-keys: |
            stock-db-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Monitor
        env:
          # 从 GitHub Secrets 安全读取你的邮箱授权码/密码
          STOCK_MONITOR_EMAIL_PASSWORD: ${{ secrets.STOCK_MONITOR_EMAIL_PASSWORD }}
        run: |
          python monitor_stock_valuation.py

      - name: Commit and push updated database cache
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/valuation_cache.sqlite3
          # 仅当数据库有变动时才提交，附带 [skip ci] 避免触发循环构建
          git diff --staged --quiet || git commit -m "Update valuation database cache [skip ci]"
          git push || echo "Push cache skipped or failed"

      - name: Upload Output Reports
        uses: actions/upload-artifact@v4
        if: always() # 无论运行成功还是失败，都把生成的报告保存下来
        with:
          name: valuation-reports
          path: output/
